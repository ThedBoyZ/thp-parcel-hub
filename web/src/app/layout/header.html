<div class="topbar">
  <div class="container topbar-inner">
    <span>Internal Data Services</span>
    <span class="status"><span class="dot" aria-hidden="true"></span>ระบบพร้อมใช้งาน</span>
  </div>
</div>

<header class="nav">
  <div class="container nav-inner">
    <a routerLink="/" class="brand" aria-label="หน้าแรก">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round">
          <path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z" />
          <path d="M3.5 7 12 11.5 20.5 7M12 11.5v10" />
        </svg>
      </span>
      <span class="brand-text">
        <strong>Parcel Data Service Hub</strong>
        <small>ระบบบริการข้อมูลพัสดุ · DEMO</small>
      </span>
    </a>

    <div class="account">
      @if (auth.user(); as user) {
        <span class="user">
          <strong>{{ user.displayName }}</strong>
          <small>{{ roleLabel[user.role] }}</small>
        </span>
        <button type="button" class="btn btn-outline btn-sm" (click)="logout()">ออกจากระบบ</button>
      } @else {
        <a routerLink="/login" class="btn btn-primary btn-sm">เข้าสู่ระบบ</a>
      }
    </div>
  </div>

  <nav class="container tabs" aria-label="เมนูหลัก">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: tab.path === '/' }" class="tab">
        {{ tab.label }}
        @if (locked(tab)) {
          <svg class="lock" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-label="ต้องเข้าสู่ระบบ">
            <rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
        }
      </a>
    }
  </nav>
</header>
